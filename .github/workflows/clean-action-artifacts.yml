name: Remove GitHub Action Old Artifacts

on:
  schedule:
    # Every day at 1am
    - cron: "0 1 * * *"

jobs:
  remove-old-artifacts:
    # Aegis fork: skip on forks. This inherited upstream housekeeping job needs
    # artifact-deletion permissions a fork does not grant, so it fails CI on
    # aegis-phase-d3-hybrid. Runs only on the canonical cosmos-sdk repo.
    if: github.repository == 'cosmos/cosmos-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "7 days"
